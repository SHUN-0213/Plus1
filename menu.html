<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="robots" content="noindex">
    <title>+1Coffee - いつものコーヒーに、新しい選択肢を</title>
    <meta name="description" content="+1Coffeeは、日常に特別なコーヒー体験を提供するブランドです。コーヒー豆、ディップ、店頭限定ドリンクなど、あなたの一日を豊かにする選択肢をお届けします。">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet"
    >
    <!-- CSS -->
    <link rel="stylesheet" href="./css/menu_style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <h1 class="header-logo">
                <a href="./index.html#top">
                    <img src="./img/logo.png" alt="+1Coffee ロゴ">
                </a>
            </h1>
            <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="menu-drawer" aria-label="メニューを開く">
                <span class="menu-toggle-line"></span>
                <span class="menu-toggle-line"></span>
                <span class="menu-toggle-line"></span>
            </button>
        </div>
    </header>
    <div class="menu-drawer-backdrop"></div>
    <nav id="menu-drawer" class="menu-drawer" aria-label="メニューナビゲーション">
        <ul class="menu-drawer-list">
            <li><a href="./index.html" class="menu-drawer-link">Top</a></li>
            <li><a href="./menu.html" class="menu-drawer-link">Beverages</a></li>
            <li><a href="./contact.html" class="menu-drawer-link">Contact</a></li>
            <li><a href="./FAQ.html" class="menu-drawer-link">FAQ</a></li>
        </ul>
    </nav>
    <main class="menu-page">
        <div class="beverages">
            <h2 class="title news-title">Beverages</h2>
        </div>
        <section id="standard" class="standard beverages-type">
            <h3>Standard</h3>
            <div class="beverages-grid">
                <article class="beverage-card">
                    <img src="./img/飲み物.png" alt="ハンドドリップコーヒーのイメージ" class="menu-beverages-img">
                    <p>ハンドドリップコーヒー</p>
                </article>
                <article class="beverage-card">
                    <img src="./img/飲み物.png" alt="カフェオレのイメージ" class="menu-beverages-img">
                    <p>カフェオレ</p>
                </article>
                <article class="beverage-card">
                    <img src="./img/飲み物.png" alt="カフェラテのイメージ" class="menu-beverages-img">
                    <p>カフェラテ</p>
                </article>
            </div>
        </section>
        <section id="signature" class="signature beverages-type">
            <h3>Signature</h3>
            <div class="beverages-grid">
                <article class="beverage-card">
                    <img src="./img/飲み物.png" alt="あんコーヒーのイメージ" class="menu-beverages-img">
                    <p>あんコーヒー</p>
                </article>
                <article class="beverage-card">
                    <img src="./img/飲み物.png" alt="みたらしオレのイメージ" class="menu-beverages-img">
                    <p>みたらしオレ</p>
                </article>
                <article class="beverage-card">
                    <img src="./img/飲み物.png" alt="オレンジコーヒーのイメージ" class="menu-beverages-img">
                    <p>オレンジコーヒー</p>
                </article>
            </div>
        </section>
        <div class="menu-info">
            <p>※メニューは予告なく変更される場合がございます。予めご了承ください。</p>
            <p>SNSなどで、出展情報をご確認ください。</p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-logo">
            <img src="./img/logo.png" alt="+1Coffee ロゴ">
        </div>
        <p class="footer-text">ー 各SNS更新中 ー</p>
        <ul class="footer-nav-list">
            <li>
                <a href="https://www.instagram.com/plus_one_stand/?__pwa=1" target="_blank" rel="noopener noreferrer" class="footer-nav-item">
                    <img src="./img/icon-instagram.png" alt="Instagramアイコン" class="sns-img">
                    <span class="footer-nav-link-text">Instagram</span>
                </a>
            </li>
            <li>
                <a href="https://x.com/plus_one_coffee/" target="_blank" rel="noopener noreferrer" class="footer-nav-item">
                    <svg class="sns-img" viewBox="0 0 24 24" width="56" height="56" role="img" aria-label="Xアイコン">
                        <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/>
                    </svg>
                    <span class="footer-nav-link-text">X</span>
                </a>
            </li>
        </ul>
        <div class="footer-copy-wrapper">
            <small class="footer-copylight">&copy;2025 +1Coffee</small>
        </div>
    </footer>
    <script src="./js/main.js"></script>
</body>
</html>
