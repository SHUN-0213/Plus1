<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="robots" content="noindex">
    <title>+1Coffee - Contact</title>
    <meta name="description" content="+1Coffeeのお問い合わせページです。">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="./css/main_style.css">
    <link rel="stylesheet" href="./css/contact_style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <h1 class="header-logo">
                <a href="./index.html#top">
                    <img src="./img/logo.png" alt="+1Coffee ロゴ">
                </a>
            </h1>
            <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="menu-drawer" aria-label="メニューを開く">
                <span class="menu-toggle-line"></span>
                <span class="menu-toggle-line"></span>
                <span class="menu-toggle-line"></span>
            </button>
        </div>
    </header>
    <div class="menu-drawer-backdrop"></div>
    <nav id="menu-drawer" class="menu-drawer" aria-label="メニューナビゲーション">
        <ul class="menu-drawer-list">
            <li><a href="./index.html" class="menu-drawer-link">Top</a></li>
            <li><a href="./menu.html" class="menu-drawer-link">Beverages</a></li>
            <li><a href="./contact.html" class="menu-drawer-link">Contact</a></li>
            <li><a href="./FAQ.html" class="menu-drawer-link">FAQ</a></li>
        </ul>
    </nav>
    <main>
        <section class="contact-page" id="contact">
            <div class="inner">
                <div class="contact-lead">
                    <h2 class="title contact-title">Contact</h2>
                    <p class="contact-description">
                        出店のご相談、ご質問、コラボレーションのご連絡はこちらからお送りください。
                    </p>
                </div>
                <div class="contact-card">
                    <div class="contact-card-header">
                        <h3 class="contact-card-title">お問い合わせフォーム</h3>
                        <p class="contact-card-text">
                            内容を確認のうえ、順次ご返信します。
                        </p>
                    </div>
                    <form class="contact-form" id="contact-form">
                        <label class="contact-field" for="contact-name">
                            <span class="contact-label">お名前</span>
                            <input id="contact-name" name="name" type="text" placeholder="山田 花子" autocomplete="name" required class="contact-input">
                        </label>
                        <label class="contact-field" for="contact-email">
                            <span class="contact-label">メールアドレス</span>
                            <input id="contact-email" name="email" type="email" placeholder="example@plusonecoffee.jp" autocomplete="email" required class="contact-input">
                        </label>
                        <label class="contact-field" for="contact-message">
                            <span class="contact-label">お問い合わせ内容</span>
                            <textarea id="contact-message" name="message" placeholder="お問い合わせ内容をご入力ください" required class="contact-textarea"></textarea>
                        </label>
                        <button type="submit" class="contact-submit">送信</button>
                        <p class="contact-form-note">このフォームはデモです。入力内容は送信されません。</p>
                        <p class="contact-form-status" id="contact-form-status" role="status" aria-live="polite" tabindex="-1" hidden></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-logo">
            <img src="./img/logo.png" alt="+1Coffee ロゴ">
        </div>
        <p class="footer-text">ー 各SNS更新中 ー</p>
        <ul class="footer-nav-list">
            <li>
                <a href="https://www.instagram.com/plus_one_stand/?__pwa=1" target="_blank" rel="noopener noreferrer" class="footer-nav-item">
                    <img src="./img/icon-instagram.png" alt="Instagramアイコン" class="sns-img">
                    <span class="footer-nav-link-text">Instagram</span>
                </a>
            </li>
            <li>
                <a href="https://x.com/plus_one_coffee/" target="_blank" rel="noopener noreferrer" class="footer-nav-item">
                    <img src="./img/icon-twitter.png" alt="Xアイコン" class="sns-img">
                    <span class="footer-nav-link-text">X</span>
                </a>
            </li>
        </ul>
        <div class="footer-copy-wrapper">
            <small class="footer-copylight">&copy;2025 +1Coffee</small>
        </div>
    </footer>
    <script src="./js/main.js"></script>
</body>
</html>
